name: docker-build
run-name: Ziad is building containers using GitHub Actions
on: [push, workflow_dispatch]
jobs:
  build-images:
    runs-on: [ubuntu-latest]
    steps:
      - name: Install apt-utils
        run: apt update && apt install -y apt-utils 
      - name: Install Docker
        run: curl -fsSL https://get.docker.com | sh
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASS }}
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: build dockerfile
        run: docker build . -t [name of image]:[tag] --no-cache
      - name: tag the image
        run: docker image tag [name of image]:amd64-dev github.com/[yourusername]/[your repo]/[name of image]:[tag]
      - name: push the docker image
        run: docker image push github.com/[your username]/[your repo/[name of image]:[tag]
