# Builds the runner's Docker image whenever the code changes and publishes it to GitHub's registry (ghcr.io).
# Rancher then pulls ghcr.io/<your-github-name>/sff-runner:latest, so you never need Docker on your own computer.
name: Build runner image

on:
  push:
    branches: [main]
    paths:
      - "scratch_fluxer/**"
      - "deploy/runner/**"
      - "requirements.txt"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the image (it must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sff-runner" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/runner/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
