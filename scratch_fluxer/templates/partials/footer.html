{% from "partials/macros.html" import icon %}
<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-brand">
      <img src="{{ static('img/logo.png') }}" alt="" width="14" height="16" decoding="async" loading="lazy">
      <span>{{ app_name }} helps you learn the Fluxer bot API with blocks.</span>
    </div>
    <nav class="footer-links" aria-label="Footer">
      <a href="/docs">Docs</a>
      <a href="/changelog">Changelog</a>
      <a href="/privacy">Privacy</a>
      <a href="{{ fluxer_web_url }}" target="_blank" rel="noopener noreferrer">Fluxer</a>
      {%- if community_url %}
      <a class="footer-community" href="{{ community_url }}" target="_blank" rel="noopener noreferrer">{{ icon("users-three") }}<span>Community server</span></a>
      {%- endif %}
      <a href="https://github.com/ZiadAgamy/ScratchForFluxer" target="_blank" rel="noopener noreferrer">Scratch For Fluxer on GitHub</a>
      <a href="https://fluxer.name/ziad" target="_blank" rel="noopener noreferrer">Developed by Ziad</a>
    </nav>
  </div>
</footer>
